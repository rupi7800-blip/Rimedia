<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rimedia — non buttare, trasforma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F0E6; --card:#FFFDF8; --ink:#2A2924; --muted:#6E6A5F; --line:#E3DBCB;
  --sage:#5F7A55; --sage-l:#E4EBDD; --terra:#B95C36; --terra-l:#F5E2D8;
  --ochre:#C99A2E; --ochre-l:#F6EBD0; --sky:#4E7A8A; --sky-l:#DDE9EC;
  --plum:#7D5A78; --plum-l:#EDE1EB; --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.15;margin:0}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 120px}
header{position:sticky;top:0;z-index:20;background:rgba(245,240,230,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink)}
.logo b{font-family:Fraunces,serif;font-size:22px;letter-spacing:-.02em}
.logo small{display:block;font-size:11px;color:var(--muted);margin-top:-3px}
nav{max-width:860px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:6px 16px 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:500;white-space:nowrap}
nav a.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hero{padding:26px 0 8px}
.hero h1{font-size:34px;letter-spacing:-.02em}
.hero p{color:var(--muted);margin:8px 0 0;max-width:560px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:18px}
.tile{display:block;text-decoration:none;color:var(--ink);border-radius:var(--r);padding:16px;border:1px solid var(--line);background:var(--card);transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:21px;margin-bottom:10px}
.tile h3{font-size:18px}
.tile p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.c-sage{background:var(--sage-l)} .c-terra{background:var(--terra-l)} .c-ochre{background:var(--ochre-l)} .c-sky{background:var(--sky-l)} .c-plum{background:var(--plum-l)}
.sec-head{padding:22px 0 6px}
.sec-head h2{font-size:28px;letter-spacing:-.01em}
.sec-head p{color:var(--muted);margin:6px 0 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:14px}
.panel h3{font-size:17px;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
.inp:focus{border-color:var(--sage)}
textarea.inp{width:100%;min-height:90px;resize:vertical}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--ink);color:var(--paper);font-weight:600;font-size:14px}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ai{background:linear-gradient(135deg,var(--terra),#9A4A2B);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--sage);color:#fff;border-color:var(--sage)}
.chip.add{color:var(--muted);border-style:dashed}
.chip x{font-weight:700;opacity:.7;cursor:pointer}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.list{display:grid;gap:10px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card .hd{display:flex;gap:12px;padding:14px;cursor:pointer;align-items:flex-start}
.card .em{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px}
.card .tt{flex:1;min-width:0}
.card h3{font-size:17px}
.card .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--paper);color:var(--muted)}
.tag.good{background:var(--sage-l);color:var(--sage)}
.tag.ai{background:var(--terra-l);color:var(--terra)}
.bar{height:5px;border-radius:5px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sage)}
.card .bd{display:none;padding:0 14px 14px;border-top:1px dashed var(--line)}
.card.open .bd{display:block}
.bd h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.ing{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.ing li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #F0EADF;font-size:14px}
.ing li.have{color:var(--sage)}
.ing li.miss{color:var(--terra)}
.ing li span:last-child{color:var(--muted);white-space:nowrap}
ol.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:12px}
.note.tip{background:var(--sage-l)}
.note.warn{background:var(--terra-l)}
.note.info{background:var(--ochre-l)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.empty{color:var(--muted);text-align:center;padding:24px 10px}
.shop-cat{margin-top:14px}
.shop-cat h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
.sitem{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
.sitem input{width:20px;height:20px;accent-color:var(--sage)}
.sitem .nm{flex:1}
.sitem.done .nm{text-decoration:line-through;color:var(--muted)}
.sitem .q{color:var(--muted);font-size:13px}
.sitem .del{border:0;background:none;color:var(--muted);font-size:18px;padding:0 4px}
.planitem{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:6px}
.planitem span{flex:1}
.loading{display:flex;gap:10px;align-items:center;color:var(--muted);padding:16px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--terra);animation:p 1s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;transition:transform .25s;max-width:90vw}
.toast.on{transform:translateX(-50%) translateY(0)}
.timer{position:fixed;right:14px;bottom:14px;z-index:40;background:var(--plum);color:#fff;border-radius:16px;padding:10px 14px;display:none;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.timer.on{display:flex}
.timer b{font-family:Fraunces,serif;font-size:22px;font-variant-numeric:tabular-nums}
.timer button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:4px 8px}
.quote{font-family:Fraunces,serif;font-size:19px;padding:18px;border-radius:var(--r);background:var(--ink);color:var(--paper);margin-top:18px}
.quote small{display:block;font-family:Inter;font-size:12px;opacity:.7;margin-top:6px}
.stat{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.stat div{flex:1;min-width:120px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{font-family:Fraunces,serif;font-size:24px;display:block}
.stat span{color:var(--muted);font-size:12.5px}
.copybox{width:100%;min-height:140px;margin-top:8px}
.hide{display:none!important}
.aihint{font-size:12.5px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<header>
  <div class="top">
    <a class="logo" href="#home">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="#2A2924"/><path d="M10 21c0-6 5-10 13-10-1 8-5 12-11 12" fill="#8FB07F"/><path d="M11 23c3-4 6-7 10-9" stroke="#2A2924" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M24 22a8 8 0 0 1-13 3" stroke="#E7B86A" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M10 22.5l1 2.8 2.7-1" stroke="#E7B86A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>Rimedia</b><small>non buttare, trasforma</small></div>
    </a>
  </div>
  <nav id="nav">
    <a href="#home" data-v="home">Home</a>
    <a href="#ricette" data-v="ricette">🍳 Ricette</a>
    <a href="#spesa" data-v="spesa">🧺 Spesa</a>
    <a href="#casa" data-v="casa">🧴 Igiene & casa</a>

</header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>
<div class="timer" id="timer"><span id="tLabel">Infusione</span><b id="tTime">0:00</b><button id="tStop">✕</button></div>

<script>
/* ================= DATI ================= */
const STAPLES=["sale","pepe","olio","olio extravergine","acqua"];

const RICETTE=[
{id:"r1",e:"🥗",t:"Panzanella",s:"Il pane raffermo diventa un piatto estivo",time:"20 min",tag:["pane","vegetariano","freddo"],
 ing:[["pane raffermo","300 g"],["pomodori","4"],["cetriolo","1"],["cipolla","½ rossa"],["basilico","1 mazzetto"],["aceto","2 cucchiai"],["olio extravergine","4 cucchiai"],["sale","q.b."]],
 st:["Taglia il pane a cubetti e bagnalo con poca acqua e aceto, poi strizzalo e sbriciolalo.","Taglia pomodori, cetriolo e cipolla sottile.","Unisci tutto con basilico, olio e sale.","Lascia riposare 15 minuti in frigo prima di servire."],
 tip:"Funziona anche con pane di 4–5 giorni: più è secco, meglio assorbe."},
{id:"r2",e:"🍅",t:"Pappa al pomodoro",s:"Classico toscano anti-spreco",time:"35 min",tag:["pane","vegetariano","caldo"],
 ing:[["pane raffermo","250 g"],["passata di pomodoro/pomodori","500 g"],["aglio","2 spicchi"],["basilico","qualche foglia"],["brodo vegetale","500 ml"],["olio extravergine","3 cucchiai"],["sale","q.b."]],
 st:["Soffriggi l'aglio nell'olio, aggiungi il pomodoro e cuoci 10 minuti.","Unisci il pane a pezzi e il brodo caldo.","Cuoci 15–20 minuti mescolando finché diventa una crema densa.","Spegni, aggiungi basilico e un filo d'olio crudo."],
 tip:"Il brodo puoi farlo con gli scarti delle verdure (vedi Brodo di scarti)."},
{id:"r3",e:"🍳",t:"Frittata di pasta avanzata",s:"La pasta di ieri diventa croccante",time:"20 min",tag:["avanzi","vegetariano"],
 ing:[["pasta avanzata","250 g"],["uova","3"],["parmigiano/formaggio","40 g"],["latte","2 cucchiai"],["olio","q.b."],["sale","q.b."]],
 st:["Sbatti le uova con formaggio, latte, sale e pepe.","Mescola con la pasta già condita.","Cuoci in padella con un filo d'olio 6–7 minuti per lato, girando con un piatto."],
 tip:"Va bene qualsiasi sugo: al pomodoro, al pesto, in bianco."},
{id:"r4",e:"🧆",t:"Polpette di pane e verdure",s:"Svuotafrigo per eccellenza",time:"35 min",tag:["pane","avanzi","vegetariano"],
 ing:[["pane raffermo","200 g"],["uova","1"],["zucchine/carote/verdure","300 g"],["parmigiano/formaggio","50 g"],["pangrattato","q.b."],["aglio","1 spicchio"],["sale","q.b."]],
 st:["Ammolla il pane nel latte o in acqua e strizzalo bene.","Grattugia o trita le verdure e saltale 5 minuti con l'aglio.","Impasta pane, verdure, uovo e formaggio; se troppo morbido aggiungi pangrattato.","Forma le polpette e cuocile in forno a 200 °C per 20 minuti."],
 tip:"Ottime anche con verdure cotte avanzate o lessi del giorno prima."},
{id:"r5",e:"🥣",t:"Brodo di scarti",s:"Bucce, gambi e foglie: oro liquido",time:"60 min",tag:["scarti","vegano","base"],
 ing:[["scarti di verdure","2 manciate"],["cipolla","1 (anche le bucce)"],["carote","1"],["sedano","1 costa"],["acqua","2 l"],["sale","q.b."]],
 st:["Lava bene gli scarti conservati (bucce di carota, gambi di prezzemolo, foglie di sedano, parti verdi del porro).","Mettili in pentola con acqua fredda.","Fai sobbollire 45 minuti, filtra e sala a fine cottura."],
 tip:"Tieni un sacchetto in freezer e aggiungi scarti puliti durante la settimana. Evita cavoli in quantità: rendono il brodo amaro."},
{id:"r6",e:"🌿",t:"Pesto di foglie di carota",s:"Le foglie che di solito si buttano",time:"10 min",tag:["scarti","vegetariano","freddo"],
 ing:[["foglie di carota","1 mazzo"],["frutta secca","30 g"],["parmigiano/formaggio","30 g"],["aglio","½ spicchio"],["olio extravergine","80 ml"],["sale","q.b."]],
 st:["Lava le foglie, scartando i gambi più duri.","Frulla con frutta secca, formaggio, aglio e sale aggiungendo l'olio a filo.","Usa subito o copri con olio e conserva in frigo 3 giorni."],
 tip:"Stessa ricetta con foglie di ravanello, cime di finocchio o basilico che sta appassendo."},
{id:"r7",e:"🥔",t:"Chips di bucce di patate",s:"Snack croccante a costo zero",time:"20 min",tag:["scarti","vegano","snack"],
 ing:[["bucce di patate/patate","di 4–5 patate"],["olio","1 cucchiaio"],["rosmarino","1 rametto"],["sale","q.b."]],
 st:["Lava bene le patate prima di sbucciarle e asciuga le bucce.","Condiscile con olio, sale e rosmarino.","Inforna a 200 °C per 12–15 minuti finché dorate."],
 tip:"Scarta le bucce con parti verdi o germogli: contengono solanina."},
{id:"r8",e:"🍙",t:"Arancini di riso avanzato",s:"Il risotto di ieri in versione croccante",time:"40 min",tag:["avanzi"],
 ing:[["riso avanzato","400 g"],["uova","2"],["mozzarella/formaggio","100 g"],["pangrattato","100 g"],["parmigiano","30 g"],["olio","per friggere o spennellare"]],
 st:["Mescola il riso freddo con 1 uovo e il parmigiano.","Prendi una porzione, metti al centro un cubetto di formaggio e chiudi a palla.","Passa nell'uovo sbattuto e nel pangrattato.","Friggi o cuoci in forno a 200 °C per 20 minuti girando a metà."],
 tip:"Il riso deve essere ben freddo, altrimenti non tiene la forma."},
{id:"r9",e:"🍮",t:"Budino di pane",s:"Dolce della nonna con pane vecchio",time:"55 min",tag:["pane","dolce","vegetariano"],
 ing:[["pane raffermo","250 g"],["latte","500 ml"],["uova","2"],["zucchero","80 g"],["cacao/uvetta/mele","a piacere"],["limone","scorza"]],
 st:["Ammolla il pane nel latte tiepido per 20 minuti.","Schiaccia con una forchetta, aggiungi uova, zucchero, scorza e cacao o frutta.","Versa in una teglia imburrata e cuoci a 180 °C per 35–40 minuti."],
 tip:"Puoi usare anche brioche, panettone o biscotti avanzati."},
{id:"r10",e:"🍌",t:"Banana bread",s:"Le banane nere sono perfette",time:"60 min",tag:["frutta","dolce","vegetariano"],
 ing:[["banane mature","3"],["farina","200 g"],["uova","2"],["zucchero","80 g"],["olio di semi/olio","70 ml"],["lievito","1 bustina"],["cannella","1 pizzico"]],
 st:["Schiaccia le banane, aggiungi uova, zucchero e olio.","Unisci farina, lievito e cannella setacciati.","Versa in uno stampo da plumcake e cuoci a 175 °C per 45–50 minuti."],
 tip:"Più le banane sono scure, più il dolce è profumato: puoi ridurre lo zucchero."},
{id:"r11",e:"🍓",t:"Composta di frutta matura",s:"Salva la frutta che sta cedendo",time:"30 min",tag:["frutta","dolce","vegano"],
 ing:[["frutta matura/mele/pere","500 g"],["zucchero","100 g"],["limone","½"]],
 st:["Taglia la frutta eliminando le parti rovinate.","Cuoci con zucchero e succo di limone a fuoco medio 20–25 minuti.","Frulla se vuoi una crema, versa in barattoli puliti e conserva in frigo fino a 10 giorni."],
 tip:"Per conservarla mesi serve la sterilizzazione dei vasetti, altrimenti tienila in frigo."},
{id:"r12",e:"🥤",t:"Frullato svuota-frutta",s:"Colazione in 3 minuti",time:"5 min",tag:["frutta","freddo","vegetariano"],
 ing:[["frutta matura/banane","2 frutti"],["yogurt/latte","200 g"],["miele","1 cucchiaino"]],
 st:["Taglia la frutta, anche congelata.","Frulla con yogurt o latte e miele fino a crema liscia."],
 tip:"Congela la frutta a pezzi prima che vada a male: il frullato viene più cremoso."},
{id:"r13",e:"🫘",t:"Pasta e fagioli",s:"Povera, calda, completa",time:"40 min",tag:["legumi","vegano","caldo"],
 ing:[["fagioli/legumi","400 g cotti"],["pasta","160 g"],["passata di pomodoro","3 cucchiai"],["cipolla","1"],["rosmarino","1 rametto"],["olio extravergine","2 cucchiai"],["sale","q.b."]],
 st:["Soffriggi la cipolla con olio e rosmarino.","Aggiungi fagioli e pomodoro, copri d'acqua e cuoci 15 minuti.","Frulla metà dei fagioli per una zuppa cremosa.","Cuoci la pasta direttamente nella zuppa."],
 tip:"Mischia i fondi di pacchi di pasta diversi: è la versione tradizionale."},
{id:"r14",e:"🥕",t:"Minestrone svuotafrigo",s:"Qualsiasi verdura, nessuno spreco",time:"45 min",tag:["vegano","caldo","avanzi"],
 ing:[["verdure miste/zucchine/carote","600 g"],["patate","2"],["cipolla","1"],["legumi/fagioli","200 g"],["pasta/riso","100 g"],["olio extravergine","2 cucchiai"],["sale","q.b."]],
 st:["Taglia tutte le verdure a cubetti.","Soffriggi la cipolla, aggiungi verdure e patate e copri d'acqua o brodo.","Cuoci 25 minuti, unisci legumi e pasta e termina la cottura."],
 tip:"Il giorno dopo è ancora più buono; congela le porzioni in più."},
{id:"r15",e:"🥚",t:"Frittata svuotafrigo",s:"Verdure, formaggi e salumi rimasti",time:"20 min",tag:["avanzi","vegetariano"],
 ing:[["uova","4"],["verdure avanzate/zucchine/spinaci","200 g"],["formaggio","50 g"],["olio","1 cucchiaio"],["sale","q.b."]],
 st:["Salta le verdure in padella se crude.","Versa sopra le uova sbattute con formaggio e sale.","Cuoci coperto a fuoco basso 8–10 minuti, poi gira o passa sotto il grill."],
 tip:"Le croste di formaggio grattugiate danno sapore."},
{id:"r16",e:"🥧",t:"Torta salata svuotafrigo",s:"Una base, mille ripieni",time:"50 min",tag:["avanzi","vegetariano","forno"],
 ing:[["pasta sfoglia/brisé","1 rotolo"],["uova","2"],["ricotta/formaggio","200 g"],["verdure avanzate/spinaci/zucchine","300 g"],["parmigiano","30 g"],["sale","q.b."]],
 st:["Mescola ricotta, uova, parmigiano e verdure cotte e strizzate.","Stendi la pasta in una teglia, bucherella il fondo e versa il ripieno.","Cuoci a 190 °C per 35 minuti."],
 tip:"Senza sfoglia? Impasta 250 g di farina, 60 ml olio, 100 ml acqua e sale."},
{id:"r17",e:"🍞",t:"Pangrattato aromatico",s:"Da pane secco a ingrediente prezioso",time:"15 min",tag:["pane","vegano","base"],
 ing:[["pane raffermo","200 g ben secco"],["rosmarino/erbe aromatiche","a piacere"],["aglio","in polvere (opz.)"]],
 st:["Se non è secchissimo, passa il pane in forno a 120 °C per 15 minuti.","Frullalo con le erbe.","Conserva in un barattolo di vetro ben chiuso."],
 tip:"Tostato in padella con olio e acciughe è il 'parmigiano dei poveri' per la pasta."},
{id:"r18",e:"🍊",t:"Scorze d'arancia candite",s:"Le bucce diventano dolcetti",time:"2 h",tag:["scarti","dolce","vegano"],
 ing:[["bucce di arancia/agrumi","di 4 arance non trattate"],["zucchero","stesso peso delle bucce"],["acqua","q.b."]],

/* ================= MATCHING ================= */
function alts(name){return name.split("/").map(norm);}
function isStaple(name){return alts(name).some(a=>STAPLES.includes(a));}
function inPantry(name){
  const as=alts(name);
  return S.pantry.some(p=>{const pn=norm(p);if(!pn)return false;
    return as.some(a=>{if(a.includes(pn)||pn.includes(a))return true;
      const ps=stem(pn.split(" ")[0]);const aw=a.split(" ").map(stem);
      return ps.length>=4&&aw.includes(ps);});});
}
function score(r){const need=r.ing.filter(i=>!isStaple(i[0]));if(!need.length)return 1;return need.filter(i=>inPantry(i[0])).length/need.length;}
const disp=n=>n.replace(/\//g," o ");

const REG={};
function card(it,kind,opts={}){
  REG[it.id]={it,kind};
  const color={ricetta:"c-terra",casa:"c-sky",brico:"c-ochre",tisana:"c-plum"}[kind]||"c-sage";
  const sc=opts.score;
  const isFav=S.favs.some(f=>f.it.id===it.id);
  let meta=[];
  if(it.ai)meta.push('<span class="tag ai">✦ Claude</span>');
  if(it.time)meta.push(`<span class="tag">⏱ ${esc(it.time)}</span>`);
  if(it.diff)meta.push(`<span class="tag">${esc(it.diff)}</span>`);
  if(it.min)meta.push(`<span class="tag">⏱ ${it.min} min</span>`);
  if(it.cat)meta.push(`<span class="tag">${it.cat==="igiene"?"Igiene personale":"Casa"}</span>`);
  if(sc!==undefined&&S.pantry.length)meta.push(`<span class="tag ${sc>=.75?"good":""}">Hai ${Math.round(sc*100)}%</span>`);
  const ingHead={ricetta:"Ingredienti",casa:"Ingredienti",brico:"Attrezzi e materiali",tisana:"Ingredienti"}[kind];
  const ingL=(it.ing||[]).map(([n,q])=>{let c="";if(kind==="ricetta"&&S.pantry.length&&!isStaple(n))c=inPantry(n)?"have":"miss";
    return `<li class="${c}"><span>${c==="have"?"✓ ":c==="miss"?"○ ":""}${esc(disp(n))}</span><span>${esc(q||"")}</span></li>`;}).join("");
  const steps=(it.st||[]).map(s=>`<li>${esc(s)}</li>`).join("");
  let acts=`<button class="btn sm sec" data-a="fav" data-id="${it.id}">${isFav?"★ Salvato":"☆ Salva"}</button>`;
  if(kind==="ricetta"){acts+=`<button class="btn sm sec" data-a="plan" data-id="${it.id}">+ Al piano</button><button class="btn sm" data-a="miss" data-id="${it.id}">🧺 Mancanti in spesa</button>`;}
  if(kind==="casa"||kind==="brico"){acts+=`<button class="btn sm" data-a="buy" data-id="${it.id}">🧺 Materiali in spesa</button>`;}
  if(kind==="tisana")acts+=`<button class="btn sm" data-a="timer" data-id="${it.id}">⏱ Avvia infusione ${it.min||5} min</button>`;
  return `<div class="card" id="cd-${it.id}">
   <div class="hd" data-a="toggle"><div class="em ${color}">${esc(it.e||"✦")}</div><div class="tt"><h3>${esc(it.t)}</h3>${it.s?`<div class="sub">${esc(it.s)}</div>`:""}<div class="meta">${meta.join("")}</div>${sc!==undefined&&S.pantry.length?`<div class="bar"><i style="width:${Math.round(sc*100)}%"></i></div>`:""}</div></div>
   <div class="bd">${ingL?`<h4>${ingHead}</h4><ul class="ing">${ingL}</ul>`:""}${steps?`<h4>Procedimento</h4><ol class="steps">${steps}</ol>`:""}
   ${it.tip?`<div class="note tip">💡 ${esc(it.tip)}</div>`:""}${it.warn?`<div class="note warn">⚠️ ${esc(it.warn)}</div>`:""}
   <div class="acts">${acts}</div></div></div>`;
}
function riciCard(it){
  REG[it.id]={it,kind:"riciclo"};
  const isFav=S.favs.some(f=>f.it.id===it.id);
  const link=it.link||it.bri;
  let linkBtn="";
  if(link){const tgt=[...RICETTE,...CASA,...BRICO].find(x=>x.id===link);if(tgt){const v=RICETTE.includes(tgt)?"ricette":CASA.includes(tgt)?"casa":"bricolage";linkBtn=`<button class="btn sm sec" data-a="goto" data-v="${v}" data-id="${tgt.id}">→ ${esc(tgt.t)}</button>`;}}
  return `<div class="card" id="cd-${it.id}"><div class="hd" data-a="toggle"><div class="em c-sage">${esc(it.e||"♻️")}</div><div class="tt"><h3>${esc(it.t)}</h3><div class="sub">${(it.ideas||[]).length} idee per una seconda vita</div>${it.ai?'<div class="meta"><span class="tag ai">✦ Claude</span></div>':""}</div></div>

}

function promptFor(key,q){
  const P={
   ricette:`Sei uno chef di cucina casalinga italiana anti-spreco. In dispensa ho: ${S.pantry.join(", ")||"(non specificato)"}. Richiesta aggiuntiva: ${q||"nessuna"}. Proponi 3 ricette realistiche che usino il più possibile ciò che ho, assumendo sempre disponibili sale, pepe, olio e acqua. Aggiungi pochi ingredienti extra solo se indispensabili. Quantità per 2 persone. Il campo tip spiega come evitare sprechi. ${SCHEMA_STD}`,
   casa:`Sei esperto di autoproduzione sicura di detergenti per la casa e cosmetici semplici. Richiesta: ${q}. Proponi fino a 3 ricette semplici con ingredienti facili da trovare in Italia. Regole di sicurezza obbligatorie: mai miscelare candeggina con acidi o ammoniaca; non proporre soda caustica né saponificazione a freddo; segnala superfici da evitare, protezioni (guanti, occhiali), conservazione e durata; per cosmetici suggerisci prova su piccola zona. Metti tutte le avvertenze nel campo warn. ${SCHEMA_STD}`,
   bricolage:`Sei un artigiano esperto che spiega piccoli lavori domestici fai-da-te a principianti. Problema: ${q}. Proponi 1 o 2 guide pratiche. In ing elenca attrezzi e materiali. Nei passi sii concreto. Nel campo warn indica rischi e quando chiamare un professionista (impianti elettrici, gas, strutture: consiglia sempre un professionista abilitato). ${SCHEMA_STD}`,
   tisane:`Sei un'erborista. Richiesta: ${q}. Proponi 3 tisane con erbe comuni in Italia, preferendo anche ingredienti di recupero (bucce, aromatiche). Indica dosi per tazza, temperatura, tempo di infusione. Aggiungi il campo "min" con il numero di minuti di infusione (intero). Nel campo warn metti controindicazioni note (gravidanza, allattamento, farmaci, pressione, allergie). Non fare promesse terapeutiche. ${SCHEMA_STD}`,
   riciclo:`Sei esperto di riuso creativo e raccolta differenziata in Italia. Oggetto da recuperare: ${q}. Rispondi SOLO con JSON valido nella forma {"items":[{"e":"emoji","t":"nome oggetto","ideas":["idea concreta di riuso 1","idea 2","idea 3","idea 4","idea 5"],"disp":"come smaltirlo correttamente se non riusabile, ricordando di verificare le regole del proprio comune"}]}. Una sola voce in items.`
  };return P[key];
}
async function askClaude(key){
  if(!sampleFn){toast("Claude non è disponibile in questa vista");return;}
  const inp=$("#ai-"+key);const q=inp?inp.value.trim():"";
  if(key!=="ricette"&&!q){toast("Scrivi cosa ti serve");inp&&inp.focus();return;}
  if(key==="ricette"&&!S.pantry.length&&!q){toast("Aggiungi qualcosa in dispensa o scrivi una richiesta");return;}
  const out=$("#aio-"+key);out.innerHTML='<div class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span> Claude sta pensando…</div>';
  const btn=document.querySelector(`[data-a="ai"][data-k="${key}"]`);if(btn)btn.disabled=true;
  try{
    const r=await sampleFn(promptFor(key,q),{modelTier:"default"});
    let txt=(r&&r.text)||"";const m=txt.match(/\{[\s\S]*\}/);
    const data=JSON.parse(m?m[0]:txt);
    const items=(data.items||[]).map((x,i)=>Object.assign(x,{id:"ai-"+key+"-"+Date.now()+"-"+i,ai:true}));
    aiCache[key]=items;
    renderAI(key);
  }catch(e){
    out.innerHTML=`<div class="empty">${e&&e.code==="rate_limited"?"Troppe richieste: riprova tra poco.":e&&e.code==="not_granted"?"Permesso non concesso per usare Claude.":"Non sono riuscito a generare una risposta. Riprova con parole diverse."}</div>`;
  }finally{if(btn)btn.disabled=false;}
}
function renderAI(key){
  const out=$("#aio-"+key);if(!out)return;const items=aiCache[key]||[];
  const kind={ricette:"ricetta",casa:"casa",bricolage:"brico",tisane:"tisana"}[key];
  out.innerHTML=items.map(it=>key==="riciclo"?riciCard(it):card(it,kind,key==="ricette"?{score:score(it)}:{})).join("");
}

   <a class="tile" href="#ricette"><div class="ic c-terra">🍳</div><h3>Ricette con quello che hai</h3><p>Inserisci la dispensa, trova cosa cucinare.</p></a>
   <a class="tile" href="#spesa"><div class="ic c-sage">🧺</div><h3>Lista della spesa</h3><p>Dal piano dei pasti, senza ricomprare ciò che hai.</p></a>
   <a class="tile" href="#casa"><div class="ic c-sky">🧴</div><h3>Igiene & casa fai-da-te</h3><p>Detersivi e cosmetici semplici e sicuri.</p></a>
   <a class="tile" href="#riciclo"><div class="ic c-sage">♻️</div><h3>Riciclo creativo</h3><p>Cosa fare di barattoli, bucce, pallet e altro.</p></a>
   <a class="tile" href="#bricolage"><div class="ic c-ochre">🔧</div><h3>Piccoli lavori</h3><p>Ripara invece di sostituire.</p></a>
   <a class="tile" href="#tisane"><div class="ic c-plum">🌿</div><h3>Tisane</h3><p>Ricette per ogni momento, con timer.</p></a>
  </div>
  <div class="quote">«Nulla si crea, nulla si distrugge, tutto si trasforma.»<small>Antoine Lavoisier</small></div>`;
};
V.ricette=()=>{
  const tags=["tutte","pane","avanzi","scarti","frutta","legumi","dolce","vegano","vegetariano"];
  let list=RICETTE.map(r=>({r,sc:score(r)}));
  if(filt.ric!=="tutte")list=list.filter(x=>x.r.tag.includes(filt.ric));
  if(S.pantry.length)list.sort((a,b)=>b.sc-a.sc);
  return `<div class="sec-head"><h2>🍳 Ricette con quello che hai</h2><p>Aggiungi gli ingredienti che hai in casa: le ricette si ordinano in base a cosa ti manca. Sale, pepe, olio e acqua si danno per scontati.</p></div>
  <div class="panel"><h3>La mia dispensa</h3>
   <form class="row" id="panForm"><input class="inp" id="panIn" placeholder="Es. zucchine, pane raffermo, uova…"><button class="btn">Aggiungi</button></form>
   <div class="chips">${S.pantry.map((p,i)=>`<span class="chip on">${esc(p)} <x data-a="unpan" data-i="${i}">×</x></span>`).join("")||'<span class="aihint">Dispensa vuota.</span>'}</div>
   <div class="chips">${QUICK.filter(q=>!S.pantry.map(norm).includes(norm(q))).map(q=>`<button class="chip add" data-a="qpan" data-v="${esc(q)}">+ ${esc(q)}</button>`).join("")}</div>
   ${S.pantry.length?'<div class="acts"><button class="btn sm sec" data-a="clearpan">Svuota dispensa</button></div>':""}
  </div>
  ${aiBlock("ricette","Facoltativo: es. cena veloce, vegetariana, per 4…","Inventa ricette")}
  <div class="filters">${tags.map(t=>`<button class="chip ${filt.ric===t?"on":""}" data-a="fric" data-v="${t}">${t}</button>`).join("")}</div>
  <div class="list">${list.map(x=>card(x.r,"ricetta",{score:x.sc})).join("")}</div>`;
};
V.spesa=()=>{
  const groups={};S.shopping.forEach((x,i)=>{(groups[x.cat]=groups[x.cat]||[]).push([x,i]);});
  const order=[...SHOPCATS.map(c=>c[0]),"Altro"];
  return `<div class="sec-head"><h2>🧺 Spesa</h2><p>Aggiungi ricette al piano, genera la lista togliendo ciò che hai già in dispensa, oppure incolla il tuo piano alimentare.</p></div>
  <div class="panel"><h3>Piano dei pasti (${S.plan.length})</h3>
   ${S.plan.length?S.plan.map((p,i)=>`<div class="planitem"><span>${esc(p.e||"🍽️")} ${esc(p.t)}</span><button class="btn sm sec" data-a="unplan" data-i="${i}">Rimuovi</button></div>`).join(""):'<div class="aihint">Nessuna ricetta nel piano. Apri una ricetta e premi "+ Al piano".</div>'}
   <div class="acts"><button class="btn sm" data-a="genshop" ${S.plan.length?"":"disabled"}>Genera lista dal piano</button>${S.plan.length?'<button class="btn sm sec" data-a="clearplan">Svuota piano</button>':""}<a class="btn sm sec" href="#ricette" style="text-decoration:none">Scegli ricette</a></div>
  </div>
  <div class="panel ai-only" style="border-color:#E7C9B8"><h3>✦ Dal tuo piano alimentare</h3>
   <textarea class="inp" id="mealplan" placeholder="Incolla il piano: es. Lunedì pranzo 80 g riso integrale, 150 g pollo, verdure… Martedì…"></textarea>
   <div class="acts"><button class="btn ai" data-a="aishop">Crea la lista con Claude</button></div><div id="aishopout"></div></div>
  <div class="panel"><h3>Lista</h3>
   <form class="row" id="shopForm"><input class="inp" id="shopIn" placeholder="Aggiungi a mano: es. 1 kg mele"><button class="btn">+</button></form>
   ${S.shopping.length?order.filter(c=>groups[c]).map(c=>`<div class="shop-cat"><h4>${c}</h4>${groups[c].map(([x,i])=>`<label class="sitem ${x.done?"done":""}"><input type="checkbox" data-a="tick" data-i="${i}" ${x.done?"checked":""}><span class="nm">${esc(x.name)}</span><span class="q">${esc(x.qty||"")}</span><button class="del" data-a="delshop" data-i="${i}" aria-label="Elimina">×</button></label>`).join("")}</div>`).join(""):'<div class="empty">La lista è vuota.</div>'}
   ${S.shopping.length?`<div class="acts"><button class="btn sm" data-a="copyshop">Copia lista</button><button class="btn sm sec" data-a="donepan">Spuntati → dispensa</button><button class="btn sm sec" data-a="cleardone">Rimuovi spuntati</button><button class="btn sm sec" data-a="clearshop">Svuota</button></div><textarea id="copybox" class="inp copybox hide" readonly></textarea>`:""}
  </div>`;
};
V.casa=()=>{
  let list=CASA;if(filt.casa!=="tutti")list=list.filter(x=>x.cat===filt.casa);
  return `<div class="sec-head"><h2>🧴 Igiene & casa fai-da-te</h2><p>Detersivi e cosmetici semplici, con pochi ingredienti di base e meno flaconi da buttare.</p></div>
  <div class="note warn"><b>Regole d'oro:</b> mai mescolare candeggina con aceto, acido citrico o ammoniaca (gas tossici). Etichetta ogni contenitore con nome e data. Tieni tutto lontano da bambini e animali. Per i cosmetici fai una prova su una piccola zona di pelle.</div>
  <div class="note info"><b>Dispensa base:</b> aceto bianco, bicarbonato, acido citrico, sapone di Marsiglia, soda Solvay, alcol etilico, cera d'api, burro di karité. Con questi fai quasi tutto.</div>
  ${aiBlock("casa","Es. detersivo per pavimenti in parquet, deodorante delicato…","Crea ricetta")}
  <div class="filters">${[["tutti","Tutti"],["casa","Casa"],["igiene","Igiene personale"]].map(([v,l])=>`<button class="chip ${filt.casa===v?"on":""}" data-a="fcasa" data-v="${v}">${l}</button>`).join("")}</div>
  <div class="list">${list.map(x=>card(x,"casa")).join("")}</div>`;
};
V.riciclo=()=>{
  const q=norm(filt.rici);const list=q?RICICLO.filter(x=>norm(x.t+" "+x.kw).includes(q)||q.split(" ").some(w=>w.length>3&&norm(x.kw).includes(stem(w)))):RICICLO;
  return `<div class="sec-head"><h2>♻️ Riciclo creativo</h2><p>Prima di buttare, chiediti: si può riusare? Qui trovi idee per gli oggetti più comuni e come smaltirli bene se proprio non servono più.</p></div>
  <div class="panel"><div class="row"><input class="inp" id="riciQ" placeholder="Cerca: barattoli, jeans, pallet…" value="${esc(filt.rici)}"></div></div>
  <div class="list" id="riciList">${list.map(riciCard).join("")||'<div class="empty">Nessuna voce trovata: chiedi a Claude qui sotto.</div>'}</div>
  ${aiBlock("riciclo","Es. vecchia scala in legno, ombrello rotto, capsule caffè…","Trova idee")}`;
};
V.bricolage=()=>`<div class="sec-head"><h2>🔧 Piccoli lavori di bricolage</h2><p>Riparare costa meno e allunga la vita delle cose. Guide passo passo con attrezzi e materiali.</p></div>
  <div class="note warn">Impianti elettrici e gas, caldaie e interventi strutturali: rivolgiti sempre a un professionista abilitato.</div>
  ${aiBlock("bricolage","Descrivi il problema: es. piastrella che si muove, tapparella bloccata…","Aiutami")}
  <div class="list">${BRICO.map(x=>card(x,"brico")).join("")}</div>`;
V.tisane=()=>{
  let list=TISANE;if(filt.tis!=="tutte")list=list.filter(x=>x.goal===filt.tis);
  return `<div class="sec-head"><h2>🌿 Tisane</h2><p>Erbe semplici, bucce di recupero e un timer per l'infusione giusta.</p></div>
  <div class="note info">Le tisane non sostituiscono cure mediche. In gravidanza, allattamento o se assumi farmaci, chiedi al medico o al farmacista: alcune erbe (es. iperico, liquirizia, ginkgo) interagiscono con i farmaci.</div>
  ${aiBlock("tisane","Es. qualcosa di caldo per il dopo allenamento, senza teina…","Suggerisci")}
  <div class="filters"><button class="chip ${filt.tis==="tutte"?"on":""}" data-a="ftis" data-v="tutte">Tutte</button>${Object.entries(GOALS).map(([k,l])=>`<button class="chip ${filt.tis===k?"on":""}" data-a="ftis" data-v="${k}">${l}</button>`).join("")}</div>
  <div class="list">${list.map(x=>card(x,"tisana")).join("")}</div>`;
};
V.quaderno=()=>`<div class="sec-head"><h2>📒 Il mio quaderno</h2><p>Le ricette, le guide e le idee che hai salvato, comprese quelle create con Claude.</p></div>
  <div class="list">${S.favs.length?S.favs.map(f=>f.kind==="riciclo"?riciCard(f.it):card(f.it,f.kind,f.kind==="ricetta"?{score:score(f.it)}:{})).join(""):'<div class="empty">Ancora niente. Premi ☆ Salva su qualsiasi scheda.</div>'}</div>`;

/* ================= ROUTER ================= */
function cur(){const h=location.hash.slice(1);return V[h]?h:"home";}
function render(){
  const v=cur();$("#app").innerHTML=V[v]();
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===v));
  const navOn=document.querySelector("#nav a.on");if(navOn)navOn.scrollIntoView({inline:"center",block:"nearest"});
  ["ricette","casa","bricolage","tisane","riciclo"].forEach(k=>{if(aiCache[k])renderAI(k);});
  document.querySelectorAll(".ai-only").forEach(el=>el.classList.toggle("hide",!sampleFn));
  bindForms();
}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0);});

/* ================= AZIONI ================= */
function addPantry(v){v.split(",").map(s=>s.trim()).filter(Boolean).forEach(x=>{if(!S.pantry.map(norm).includes(norm(x)))S.pantry.push(x);});save();render();}
function catOf(name){const n=norm(name);for(const[c,re] of SHOPCATS)if(re.test(n))return c;return "Altro";}
function addShop(name,qty,cat){
  const n=norm(name);const ex=S.shopping.find(x=>norm(x.name)===n&&!x.done);
  if(ex){if(qty&&!String(ex.qty).includes(qty))ex.qty=ex.qty?ex.qty+" + "+qty:qty;return false;}
  S.shopping.push({name,qty:qty||"",cat:cat||catOf(name),done:false});return true;
}
function missingOf(it){return (it.ing||[]).filter(([n])=>!isStaple(n)&&!inPantry(n));}
function findItem(id){return REG[id]||null;}
function bindForms(){
  const pf=$("#panForm");if(pf)pf.onsubmit=e=>{e.preventDefault();const v=$("#panIn").value;if(v.trim())addPantry(v);setTimeout(()=>{const i=$("#panIn");i&&i.focus();},0);};
  const sf=$("#shopForm");if(sf)sf.onsubmit=e=>{e.preventDefault();const v=$("#shopIn").value.trim();if(!v)return;const m=v.match(/^([\d.,]+\s*(?:kg|g|l|ml|pz|x)?)\s+(.+)$/i);addShop(m?m[2]:v,m?m[1]:"");save();render();setTimeout(()=>{const i=$("#shopIn");i&&i.focus();},0);};
  const rq=$("#riciQ");if(rq)rq.oninput=e=>{filt.rici=e.target.value;const q=norm(filt.rici);const list=q?RICICLO.filter(x=>norm(x.t+" "+x.kw).includes(q)||q.split(" ").some(w=>w.length>3&&norm(x.kw).includes(stem(w)))):RICICLO;$("#riciList").innerHTML=list.map(riciCard).join("")||'<div class="empty">Nessuna voce trovata: chiedi a Claude qui sotto.</div>';const ai=$("#ai-riciclo");if(ai&&!list.length)ai.value=filt.rici;};
  document.querySelectorAll('input[id^="ai-"]').forEach(i=>i.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();askClaude(i.id.slice(3));}});
}
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,id=el.dataset.id;
  if(a==="toggle"){el.closest(".card").classList.toggle("open");return;}
  if(a==="qpan"){addPantry(el.dataset.v);return;}
  if(a==="unpan"){S.pantry.splice(+el.dataset.i,1);save();render();return;}
  if(a==="clearpan"){S.pantry=[];save();render();return;}
  if(a==="fric"){filt.ric=el.dataset.v;render();return;}
  if(a==="fcasa"){filt.casa=el.dataset.v;render();return;}
  if(a==="ftis"){filt.tis=el.dataset.v;render();return;}
  if(a==="ai"){askClaude(el.dataset.k);return;}
  if(a==="goto"){location.hash=el.dataset.v;setTimeout(()=>{const c=$("#cd-"+id);if(c){c.classList.add("open");c.scrollIntoView({block:"center"});}},50);return;}
  const reg=id?findItem(id):null;
  if(a==="fav"&&reg){const i=S.favs.findIndex(f=>f.it.id===id);if(i>=0){S.favs.splice(i,1);toast("Rimosso dal quaderno");}else{S.favs.push({kind:reg.kind,it:reg.it});toast("Salvato nel quaderno");}save();const open=el.closest(".card").classList.contains("open");
    if(cur()==="quaderno")render();else{el.textContent=i>=0?"☆ Salva":"★ Salvato";}if(open)return;return;}
  if(a==="plan"&&reg){if(!S.plan.some(p=>p.id===id)){S.plan.push(reg.it);save();toast("Aggiunta al piano dei pasti");}else toast("È già nel piano");return;}
  if(a==="miss"&&reg){const m=missingOf(reg.it);if(!m.length){toast("Hai già tutto 👌");return;}m.forEach(([n,q])=>addShop(disp(n),q));save();toast(m.length+" ingredienti aggiunti alla spesa");return;}
  if(a==="buy"&&reg){let n=0;(reg.it.ing||[]).forEach(([nm,q])=>{if(!inPantry(nm)&&!isStaple(nm)){addShop(disp(nm),q,reg.kind==="casa"?"Casa e igiene":"Altro");n++;}});save();toast(n+" voci aggiunte alla spesa");return;}
  if(a==="timer"&&reg){startTimer(reg.it.t,(reg.it.min||5)*60);return;}
  if(a==="unplan"){S.plan.splice(+el.dataset.i,1);save();render();return;}
  if(a==="clearplan"){S.plan=[];save();render();return;}
  if(a==="genshop"){let n=0,skip=0;S.plan.forEach(r=>(r.ing||[]).forEach(([nm,q])=>{if(isStaple(nm))return;if(inPantry(nm)){skip++;return;}if(addShop(disp(nm),q))n++;}));save();render();toast(`${n} voci aggiunte, ${skip} già in dispensa`);return;}
  if(a==="tick"){S.shopping[+el.dataset.i].done=el.checked;save();el.closest(".sitem").classList.toggle("done",el.checked);return;}
  if(a==="delshop"){e.preventDefault();S.shopping.splice(+el.dataset.i,1);save();render();return;}
  if(a==="cleardone"){S.shopping=S.shopping.filter(x=>!x.done);save();render();return;}
  if(a==="clearshop"){S.shopping=[];save();render();return;}
  if(a==="donepan"){const d=S.shopping.filter(x=>x.done);d.forEach(x=>{if(!S.pantry.map(norm).includes(norm(x.name))&&x.cat!=="Casa e igiene")S.pantry.push(x.name);});S.shopping=S.shopping.filter(x=>!x.done);save();render();toast(d.length+" voci spostate in dispensa");return;}
  if(a==="copyshop"){const txt=["Lista della spesa — Rimedia",""].concat(S.shopping.filter(x=>!x.done).map(x=>"• "+x.name+(x.qty?" ("+x.qty+")":""))).join("\n");
    try{await navigator.clipboard.writeText(txt);toast("Lista copiata");}catch(err){const b=$("#copybox");b.value=txt;b.classList.remove("hide");b.select();toast("Copia il testo qui sotto");}return;}
  if(a==="aishop"){aiShop();return;}
});
async function aiShop(){
  if(!sampleFn){toast("Claude non è disponibile");return;}
  const plan=$("#mealplan").value.trim();if(!plan){toast("Incolla il tuo piano alimentare");return;}
  const out=$("#aishopout");out.innerHTML='<div class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span> Calcolo la spesa…</div>';
  const cats=SHOPCATS.map(c=>c[0]).concat("Altro").join(", ");
  try{
    const r=await sampleFn(`Trasforma questo piano alimentare in una lista della spesa consolidata, sommando le quantità dello stesso alimento sull'intero periodo e arrotondando a confezioni realistiche. Escludi sale, pepe, olio e acqua. Escludi anche ciò che ho già in dispensa: ${S.pantry.join(", ")||"niente"}. Categorie ammesse: ${cats}.
Piano:
${plan}
Rispondi SOLO con JSON valido: {"items":[{"name":"alimento","qty":"quantità totale","cat":"categoria"}]}`,{modelTier:"default"});
    const m=(r.text||"").match(/\{[\s\S]*\}/);const data=JSON.parse(m?m[0]:r.text);let n=0;
    (data.items||[]).forEach(x=>{if(x&&x.name&&addShop(x.name,x.qty,x.cat))n++;});save();render();toast(n+" voci aggiunte alla lista");
  }catch(e){out.innerHTML='<div class="empty">Non sono riuscito a leggere il piano. Riprova.</div>';}
}

/* ================= TIMER ================= */
let tInt=null,actx=null;
function startTimer(label,sec){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume();}catch(e){}
  clearInterval(tInt);let end=Date.now()+sec*1000;$("#tLabel").textContent="🌿 "+label;$("#timer").classList.add("on");
  const tick=()=>{const s=Math.max(0,Math.round((end-Date.now())/1000));$("#tTime").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
    if(s<=0){clearInterval(tInt);$("#tTime").textContent="Pronta!";beep();try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}};
  tick();tInt=setInterval(tick,500);
}
function beep(){try{if(!actx)return;[0,.35,.7].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.3,actx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.3);o.connect(g).connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.32);});}catch(e){}}
$("#tStop").onclick=()=>{clearInterval(tInt);$("#timer").classList.remove("on");};

/* ================= AVVIO ================= */
loadLocal();
sampleFn=undefined; // sconosciuto finché non risponde
render();
document.querySelectorAll(".ai-only").forEach(el=>el.classList.add("hide"));
(async()=>{
  const C=window.claude;if(!C||!C.use){sampleFn=null;render();return;}
  C.use("sample").then(s=>{sampleFn=s||null;render();}).catch(()=>{sampleFn=null;render();});
  try{
    const [dbx,user]=await Promise.all([C.use("db"),C.use("user")]);
    if(dbx&&user){const uid=await user.id();if(uid){db=dbx;dref=db.doc("data/users/"+uid+"/stato");
      let done=false;const to=setTimeout(()=>{done=true;},10000);
      const snap=await dref.get();clearTimeout(to);if(done)return;
      const d=snap&&(typeof snap.data==="function"?snap.data():(snap.data!==undefined?snap.data:snap));
      if(d&&typeof d==="object"&&(d.pantry||d.shopping||d.favs||d.plan)){S=Object.assign({pantry:[],shopping:[],plan:[],favs:[]},d);try{localStorage.setItem("rimedia",JSON.stringify(S));}catch(e){}render();}
      else if(S.pantry.length||S.shopping.length||S.favs.length||S.plan.length){dref.set(JSON.parse(JSON.stringify(S))).catch(()=>{});}
    }}
  }catch(e){}
})();
</script>
