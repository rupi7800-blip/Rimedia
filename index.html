<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rimedia — non buttare, trasforma</title>
<meta name="theme-color" content="#2F4A37">
<meta name="description" content="Rimedia: ricette anti-spreco, riciclo, autoproduzione, bricolage, orto e risparmio, con un'intelligenza artificiale in ogni scheda.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rimedia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Rimedia 2 — palette naturale: salvia, bosco, beige, bianco caldo, terra ===== */
:root{
  --paper:#F3EEE3; --card:#FFFCF6; --ink:#27302A; --muted:#687064; --line:#E3DBCB; --soft:#F8F4EC;
  --forest:#2F4A37; --forest-2:#3D5E46; --sage:#6B8A63; --sage-l:#E4ECDD;
  --terra:#A65F3C; --terra-l:#F4E4D8; --ochre:#B48A36; --ochre-l:#F4EAD2;
  --sky:#557C83; --sky-l:#DFEAE8; --plum:#7A6176; --plum-l:#ECE2EA; --earth:#86694B; --earth-l:#EFE6D8;
  --r:16px; --shadow:0 1px 2px rgba(39,48,42,.05),0 4px 14px rgba(39,48,42,.05);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-weight:700;line-height:1.18;margin:0;letter-spacing:-.01em}
a{color:var(--forest)}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.wrap{max-width:920px;margin:0 auto;padding:0 16px 120px}
/* header */
header{position:sticky;top:0;z-index:30;background:rgba(243,238,227,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px 6px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);flex:none}
.logo b{font-family:Georgia,serif;font-size:21px;color:var(--forest)}
.logo small{display:block;font-size:11px;color:var(--muted);margin-top:-3px}
.hsearch{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 12px}
.hsearch input{flex:1;min-width:0;border:0;background:none;outline:none;padding:9px 0;font-size:14.5px}
.hsearch button{border:0;background:var(--forest);color:#fff;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600}
.gear{flex:none;text-decoration:none;color:var(--ink);font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);padding:7px 11px;border-radius:999px;white-space:nowrap}
@media(max-width:560px){.logo div{display:none}.gear span{display:none}}
nav#nav{max-width:920px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
nav#nav::-webkit-scrollbar{display:none}
nav#nav a{flex:none;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:500;white-space:nowrap}
nav#nav a.on{background:var(--forest);color:#fff;border-color:var(--forest)}
/* bottom tab bar (smartphone) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:35;display:none;background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;padding:5px 0;border-radius:10px}
.tabbar a i{font-style:normal;font-size:19px;line-height:1.2}
.tabbar a.on{color:var(--forest);background:var(--sage-l)}
@media(max-width:760px){.tabbar{display:flex}.wrap{padding-bottom:150px}}
/* hero & home */
.hero{padding:24px 0 6px}
.hero h1{font-size:32px;color:var(--forest)}
.hero p{color:var(--muted);margin:8px 0 0;max-width:600px}
.bigsearch{margin-top:16px;background:var(--forest);color:#fff;border-radius:20px;padding:16px}
.bigsearch h3{font-size:18px;color:#fff}
.bigsearch p{margin:4px 0 10px;opacity:.85;font-size:13.5px}
.bigsearch .row .inp{background:#fff;color:var(--ink);border-color:transparent}
.bigsearch .btn{background:#E9D9B4;color:var(--forest)}
.bigsearch .chip{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-top:18px}
@media(max-width:560px){.tile .vis{height:64px;font-size:32px}.tile h3{font-size:15.5px}.tile p{font-size:12.5px}}
.tile{position:relative;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);border-radius:var(--r);border:1px solid var(--line);background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
.tile .vis{height:86px;display:grid;place-items:center;font-size:40px}
.tile .tb{padding:11px 13px 13px}
.tile h3{font-size:17px}
.tile p{margin:3px 0 0;color:var(--muted);font-size:13px}
.tile .cnt{position:absolute;top:8px;right:8px;background:rgba(255,252,246,.9);border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700;color:var(--forest)}
.tile:active{transform:scale(.985)}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:21px;margin-bottom:10px}
.c-sage{background:var(--sage-l)} .c-terra{background:var(--terra-l)} .c-ochre{background:var(--ochre-l)} .c-sky{background:var(--sky-l)} .c-plum{background:var(--plum-l)} .c-earth{background:var(--earth-l)} .c-forest{background:#D7E2D4}
.vis.c-sage{background:linear-gradient(135deg,#E4ECDD,#CFDDC6)} .vis.c-terra{background:linear-gradient(135deg,#F4E4D8,#EBCDB9)} .vis.c-ochre{background:linear-gradient(135deg,#F4EAD2,#EAD8AE)} .vis.c-sky{background:linear-gradient(135deg,#DFEAE8,#C7DBD8)} .vis.c-plum{background:linear-gradient(135deg,#ECE2EA,#DCCAD9)} .vis.c-earth{background:linear-gradient(135deg,#EFE6D8,#E0CFB6)} .vis.c-forest{background:linear-gradient(135deg,#D7E2D4,#BFD0BC)}
/* sezioni */
.sec-head{padding:22px 0 4px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.sec-head>div{flex:1;min-width:240px}
.sec-head h2{font-size:27px;color:var(--forest)}
.sec-head p{color:var(--muted);margin:6px 0 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:14px;box-shadow:var(--shadow)}
.panel h3{font-size:17px;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
.inp:focus{border-color:var(--sage)}
textarea.inp{width:100%;min-height:90px;resize:vertical}
select.inp{min-width:0}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--forest);color:#fff;font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ai{background:linear-gradient(135deg,var(--forest-2),var(--forest));color:#fff}
.btn.aiq{background:var(--sage-l);color:var(--forest);border:1px solid #CFDCC6}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--sage);color:#fff;border-color:var(--sage)}
.chip.off{background:#fff;color:var(--muted);text-decoration:line-through}
.chip[data-a="selpan"]{cursor:pointer}
#results,#aiOut{scroll-margin-top:120px}
.rgrp{font-size:17px;margin:20px 0 0;display:flex;align-items:center;gap:8px}.rgrp span{font-family:system-ui,sans-serif;font-size:12px;background:var(--sage-l);color:var(--forest);padding:1px 8px;border-radius:999px}
details.rmore,details.quick{margin-top:12px}details summary{cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:600}
.chip.add{color:var(--muted);border-style:dashed}
.chip x{font-weight:700;opacity:.7;cursor:pointer}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.list{display:grid;gap:10px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.card .hd{display:flex;gap:12px;padding:14px;cursor:pointer;align-items:flex-start}
.card .em{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px}
.card .tt{flex:1;min-width:0}
.card h3{font-size:17px}
.card .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.card .chev{flex:none;color:var(--muted);transition:transform .15s;margin-top:4px}
.card.open .chev{transform:rotate(180deg)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.tag.good{background:var(--sage-l);color:var(--forest);border-color:#CFDCC6}
.tag.ai{background:var(--sage-l);color:var(--forest);border-color:#CFDCC6}
.tag.gen{background:var(--ochre-l);color:#7c5b14;border-color:#E8D7A9}
.bar{height:5px;border-radius:5px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sage)}
.card .bd{display:none;padding:0 14px 14px;border-top:1px dashed var(--line)}
.card.open .bd{display:block}
.bd h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:12px}
.facts div{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:13px}
.facts b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.ing{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.ing li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #EFE8DA;font-size:14px}
.ing li.have{color:var(--sage)}
.ing li.miss{color:var(--terra)}
.ing li span:last-child{color:var(--muted);text-align:right}
ol.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:12px}
.note.tip{background:var(--sage-l)}
.note.warn{background:var(--terra-l)}
.note.info{background:var(--ochre-l)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.empty{color:var(--muted);text-align:center;padding:24px 10px}
.shop-cat{margin-top:14px}
.shop-cat h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
.sitem{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
.sitem input{width:20px;height:20px;accent-color:var(--sage)}
.sitem .nm{flex:1}
.sitem.done .nm{text-decoration:line-through;color:var(--muted)}
.sitem .q{color:var(--muted);font-size:13px}
.sitem .del{border:0;background:none;color:var(--muted);font-size:18px;padding:0 4px}
.planitem{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:6px}
.planitem span{flex:1}
.loading{display:flex;gap:10px;align-items:center;color:var(--muted);padding:16px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sage);animation:p 1s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(200px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:70;transition:transform .25s;max-width:90vw}
.toast.on{transform:translateX(-50%) translateY(0)}
.timer{position:fixed;left:14px;bottom:84px;z-index:40;background:var(--plum);color:#fff;border-radius:16px;padding:10px 14px;display:none;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.timer.on{display:flex}
.timer b{font-family:Georgia,serif;font-size:22px;font-variant-numeric:tabular-nums}
.timer button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:4px 8px}
.quote{font-family:Georgia,serif;font-size:18px;padding:18px;border-radius:var(--r);background:var(--forest);color:#F3EEE3;margin-top:18px}
.quote small{display:block;font-family:system-ui,sans-serif;font-size:12px;opacity:.75;margin-top:6px}
.stat{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.stat a,.stat div{flex:1;min-width:110px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-decoration:none;color:inherit}
.stat b{font-family:Georgia,serif;font-size:24px;display:block;color:var(--forest)}
.stat span{color:var(--muted);font-size:12.5px}
.copybox{width:100%;min-height:140px;margin-top:8px}
.hide{display:none!important}
.modes{display:grid;grid-template-columns:1fr;gap:6px;margin-top:14px}
@media(min-width:560px){.modes{grid-template-columns:repeat(4,1fr)}}
h4.mini{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 0}
.aipanel{border-color:#CFDCC6}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;margin-left:10px}
.chk input{width:18px;height:18px;accent-color:var(--sage)}
ul.adv{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.msg{max-width:90%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--forest);color:#fff;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--soft);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.err{background:var(--terra-l)}
.msg .dot{display:inline-block;margin-right:3px}
.msg .macts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.hero-img{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:12px}
.thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none}
a.linkcard{display:block;text-decoration:none;color:inherit}
.arow{padding:10px 0;border-bottom:1px dashed var(--line)}.arow:last-of-type{border-bottom:0}
.arow .chips{margin-top:6px}
.chip.pair.ok{background:#F7E3E3;border-color:#EBC5C5}.chip.pair.good{background:var(--sage-l);border-color:#CFDCC6}.chip.pair.bad{background:var(--terra-l);border-color:#E9C6B6}
.lnk{border:0;background:none;color:var(--forest);font-weight:600;padding:0;text-decoration:underline}
.aihint{font-size:12.5px;color:var(--muted);margin-top:6px}
.field{display:grid;gap:4px;margin-top:10px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.prov{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-top:8px;background:#fff}
.prov summary{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:600;font-size:14px}
.prov summary .tag{margin-left:auto}
.hist{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.hist span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* foglio AI (drawer) */
.sheet-bg{position:fixed;inset:0;background:rgba(20,26,22,.35);z-index:60;display:none}
.sheet{position:fixed;z-index:61;left:0;right:0;bottom:0;max-height:88vh;display:none;flex-direction:column;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.2);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on,.sheet-bg.on{display:flex}
.sheet-bg.on{display:block}
@media(min-width:900px){.sheet{left:auto;right:16px;bottom:16px;top:16px;width:440px;max-height:none;border-radius:20px}}
.sh-hd{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sh-hd h3{font-size:17px;color:var(--forest)}
.sh-hd small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.sh-hd button{margin-left:auto;border:0;background:var(--soft);border-radius:999px;width:34px;height:34px;font-size:18px;flex:none}
.sh-bd{flex:1;overflow-y:auto;padding:10px 16px}
.sh-ft{border-top:1px solid var(--line);padding:10px 16px}
.sh-ft form{display:flex;gap:8px}
.sh-ft textarea{flex:1;min-height:44px;max-height:120px;resize:none;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
.ctxbox{font-size:12.5px;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:34;border:0;border-radius:999px;background:linear-gradient(135deg,var(--forest-2),var(--forest));color:#fff;font-weight:700;padding:12px 16px;box-shadow:0 8px 24px rgba(47,74,55,.35);font-size:14px}
@media(min-width:761px){.fab{bottom:20px}}
</style>
</head>
<body>

  <div class="top">
    <a class="logo" href="#home" aria-label="Rimedia, home">

      <div><b>Rimedia</b><small>non buttare, trasforma</small></div>

    <form class="hsearch" id="hsForm" role="search"><input id="hsIn" type="search" placeholder="Cerca ricette, materiali, problemi…" aria-label="Cerca in Rimedia" autocomplete="off"><button aria-label="Cerca">🔎</button></form>
    <span data-update-slot></span>
    <a href="#ai-setup" class="gear" aria-label="Impostazioni AI">⚙️ <span>AI</span></a>
  </div>
  <nav id="nav" aria-label="Sezioni">
    <a href="#home" data-v="home">Home</a>
    <a href="#ricette" data-v="ricette">🍳 Cucina</a>
    <a href="#spesa" data-v="spesa">🧺 Spesa</a>
    <a href="#casa" data-v="casa">🧴 Autoproduzione</a>
    <a href="#riciclo" data-v="riciclo">♻️ Riciclo</a>
    <a href="#bricolage" data-v="bricolage">🔧 Bricolage</a>
    <a href="#orto" data-v="orto">🌱 Orto</a>
    <a href="#risparmio" data-v="risparmio">💶 Risparmio</a>

/* ================= MATCHING ================= */
function alts(name){return name.split("/").map(norm);}
function isStaple(name){return alts(name).some(a=>STAPLES.includes(a));}
function selected(){const u=(S.unsel||[]);return S.pantry.filter(p=>!u.includes(norm(p)));}
function isSel(p){return !(S.unsel||[]).includes(norm(p));}
function inPantry(name,sel){
  const as=alts(name);
  return (sel?selected():S.pantry).some(p=>{const pn=norm(p);if(!pn)return false;
    return as.some(a=>{if(a.includes(pn)||pn.includes(a))return true;
      const ps=stem(pn.split(" ")[0]);const aw=a.split(" ").map(stem);
      return ps.length>=4&&aw.includes(ps);});});
}
function score(r){const need=r.ing.filter(i=>!isStaple(i[0]));if(!need.length)return 1;return need.filter(i=>inPantry(i[0],true)).length/need.length;}
const disp=n=>n.replace(/\//g," o ");

function promptFor(key,q){
  const P={
   ricette:`Sei uno chef di cucina casalinga italiana anti-spreco. Voglio cucinare usando questi ingredienti che ho: ${selected().join(", ")||"(non specificato)"}. Richiesta aggiuntiva: ${q||"nessuna"}. Analisi abbinamenti dell'app: ${(()=>{try{const a=analyze();return a.rows.map(r=>r.k+" si abbina con "+(r.good.join("/")||"-")).join("; ");}catch(e){return "";}})()}. Sfrutta gli abbinamenti migliori. Proponi 3 ricette realistiche che usino il più possibile ciò che ho, assumendo sempre disponibili sale, pepe, olio e acqua. Aggiungi pochi ingredienti extra solo se indispensabili. Quantità per 2 persone. Il campo tip spiega come evitare sprechi. ${SCHEMA_STD}`,
   casa:`Sei esperto di autoproduzione sicura di detergenti per la casa e cosmetici semplici. Richiesta: ${q}. Proponi fino a 3 ricette semplici con ingredienti facili da trovare in Italia. Regole di sicurezza obbligatorie: mai miscelare candeggina con acidi o ammoniaca; non proporre soda caustica né saponificazione a freddo; segnala superfici da evitare, protezioni (guanti, occhiali), conservazione e durata; per cosmetici suggerisci prova su piccola zona. Metti tutte le avvertenze nel campo warn. ${SCHEMA_STD}`,
   bricolage:`Sei un artigiano esperto che spiega piccoli lavori domestici fai-da-te a principianti. Problema: ${q}. Proponi 1 o 2 guide pratiche. In ing elenca attrezzi e materiali. Nei passi sii concreto. Nel campo warn indica rischi e quando chiamare un professionista (impianti elettrici, gas, strutture: consiglia sempre un professionista abilitato). ${SCHEMA_STD}`,
   tisane:`Sei un'erborista. Richiesta: ${q}. Proponi 3 tisane con erbe comuni in Italia, preferendo anche ingredienti di recupero (bucce, aromatiche). Indica dosi per tazza, temperatura, tempo di infusione. Aggiungi il campo "min" con il numero di minuti di infusione (intero). Nel campo warn metti controindicazioni note (gravidanza, allattamento, farmaci, pressione, allergie). Non fare promesse terapeutiche. ${SCHEMA_STD}`,
   orto:`Sei un esperto di orticoltura naturale, compostaggio e recupero in giardino, in Italia. Richiesta: ${q}. Proponi fino a 3 guide pratiche che usino materiali di recupero e metodi a basso impatto. In ing elenca materiali e quantità, nei passi sii concreto e indica il periodo dell'anno se conta. Nel campo warn indica i rischi (attrezzi, sostanze, piante tossiche, carichi pesanti). Non proporre pesticidi chimici. ${SCHEMA_STD}`,
   risparmio:`Sei un consulente pratico di risparmio domestico e autonomia (acqua, energia, cibo, manutenzione, spese) in Italia. Richiesta: ${q}. Proponi fino a 3 azioni concrete, dalla più semplice. In ing elenca l'occorrente (anche vuoto), nei passi sii concreto, in cost indica la spesa iniziale e nel campo res il risparmio atteso come stima prudente. Nel campo warn segnala ciò che va fatto da professionisti (gas, elettricità, caldaie). ${SCHEMA_STD}`,
   riciclo:`Sei esperto di riuso creativo e raccolta differenziata in Italia. Oggetto da recuperare: ${q}. Rispondi SOLO con JSON valido nella forma {"items":[{"e":"emoji","t":"nome oggetto","ideas":["idea concreta di riuso 1","idea 2","idea 3","idea 4","idea 5"],"disp":"come smaltirlo correttamente se non riusabile, ricordando di verificare le regole del proprio comune"}]}. Una sola voce in items.`
  };return P[key];
}
async function askClaude(key){
  const inp=$("#ai-"+key);const q=inp?inp.value.trim():"";
  if(key!=="ricette"&&!q){toast("Scrivi cosa ti serve");inp&&inp.focus();return;}
  if(key==="ricette"&&!selected().length&&!q){toast("Aggiungi qualcosa in dispensa o scrivi una richiesta");return;}
  const out=$("#aio-"+key);out.innerHTML='<div class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span> L\'AI sta pensando…</div>';
  const btn=document.querySelector(`[data-a="ai"][data-k="${key}"]`);if(btn)btn.disabled=true;
  try{
    const txt=await aiCall("Sei l'assistente esperto dell'app Rimedia (autoproduzione, riciclo, anti-spreco). Scrivi in italiano.",promptFor(key,q),{json:true});
    const data=parseJSON(txt);
    const items=(data.items||[]).map((x,i)=>key==="riciclo"?Object.assign(x,{id:"ai-"+key+"-"+Date.now()+"-"+i,ai:true}):normItem(x,"ai-"+key,i));
    if(!items.length)throw new AIError("parse","Nessuna proposta ricevuta: riprova");
    aiCache[key]=items;
    renderAI(key);
  }catch(e){
    out.innerHTML=`<div class="note warn">${esc(e.message||"Non sono riuscito a generare una risposta. Riprova.")}</div>`;
  }finally{if(btn)btn.disabled=false;}
}
function renderAI(key){
  const out=$("#aio-"+key);if(!out)return;const items=aiCache[key]||[];
  const kind={ricette:"ricetta",casa:"casa",bricolage:"brico",tisane:"tisana",orto:"orto",risparmio:"risp"}[key];
  out.innerHTML=items.map(it=>key==="riciclo"?riciCard(it):card(it,kind,key==="ricette"?{score:score(it)}:{})).join("");
}

const SYN={bancale:"pallet",bancali:"pallet",pedana:"pallet",pedane:"pallet",vasetti:"barattoli",vasetto:"barattoli",barattolo:"barattoli",scarto:"scarti",buccia:"bucce",raffermo:"pane",stantio:"raffermo",bottiglia:"bottiglie",legna:"legno",legname:"legno",tavole:"legno",stoffa:"tessuti",tessuto:"tessuti",vestiti:"magliette",maglietta:"magliette",lattina:"lattine",ferro:"metallo",arrugginito:"ruggine",ruggine:"arrugginiti",perde:"gocciola",gocciolare:"gocciola",cigolio:"cigola",avanzi:"avanzato",avanzata:"avanzato",detersivo:"detergente",concime:"fertilizzante",fertilizzante:"concime",bolletta:"bollette",bollette:"risparmio",risparmiare:"risparmio",mobile:"mobili",sedia:"sedie",elettrodomestico:"elettrodomestici",telefono:"telefoni",cellulare:"telefoni",piastrella:"piastrelle",mattone:"mattoni",calcinacci:"edilizia",demolizione:"demolizione",umido:"compost",organico:"compost",sughero:"tappi",candela:"candele",cera:"candele",scaduto:"scadenza",scade:"scadenza"};
const STOP=new Set("di da del dello della dei degli delle il lo la i gli le un uno una e ed o con per su in a al allo alla ai agli alle che come cosa cose posso possono fare farne farci ho hai abbiamo voglio vorrei mio mia miei mie qualche alcuni alcune vecchi vecchie vecchio vecchia g kg gr grammi litri l ml pezzi pz circa tanti tante molti molte po".split(" "));
function qTokens(q){const out=[];norm(q).split(" ").filter(w=>w&&w.length>1&&!STOP.has(w)&&!/^\d+$/.test(w)).forEach(w=>{if(!out.some(g=>g[0]===w))out.push(SYN[w]&&SYN[w]!==w?[w,SYN[w]]:[w]);});return out;}
function wordHit(text,w){if(text.includes(w))return true;const s=stem(w);return s.length>=4&&text.includes(s);}
function fieldScore(x,w){return wordHit(x.title,w)?6:wordHit(x.main,w)?3:wordHit(x.body,w)?1:0;}
function searchAll(q,min=1){
  if(!IDX)buildIdx();const groups=qTokens(q);if(!groups.length)return[];
  let res=IDX.map(x=>{let sc=0,hits=0;groups.forEach(g=>{const h=Math.max(fieldScore(x,g[0]),g[1]?fieldScore(x,g[1])*.8:0);if(h)hits++;sc+=h;});
    if(groups.length>1&&hits>=groups.length)sc*=1.5;else if(groups.length>1&&hits===1)sc*=.7;return {x,sc};}).filter(r=>r.sc>=min).sort((a,b)=>b.sc-a.sc);
  // se ci sono risultati pertinenti nel titolo o negli ingredienti/materiali, nascondi quelli citati solo di passaggio
  if(res.some(r=>r.sc>=3))res=res.filter(r=>r.sc>=2);
  return res;
}

const KB_SYN={};Object.entries(KB).forEach(([k,v])=>{KB_SYN[norm(k)]=k;(v[4]||"").split(" ").filter(Boolean).forEach(s=>KB_SYN[norm(s)]=k);});
function keyOf(p){
  const n=norm(p);if(KB_SYN[n])return KB_SYN[n];
  if(KB[n])return n;
  for(const k of Object.keys(KB)){if(n===norm(k)||n.startsWith(norm(k)+" ")||norm(k).startsWith(n+" "))return k;}
  const w=stem(n.split(" ")[0]);
  for(const [s,k] of Object.entries(KB_SYN)){if(stem(s.split(" ")[0])===w&&w.length>=4)return k;}
  for(const k of Object.keys(KB)){if(stem(norm(k).split(" ")[0])===w&&w.length>=4)return k;}
  return null;
}
function pairs(k){return (KB[k]?KB[k][3]:"").split(" ").filter(Boolean);}
function pairScore(a,b){
  if(a===b)return 0;
  if(CLASH.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a)))return -2;
  const pa=pairs(a),pb=pairs(b);
  // gestisce chiavi di due parole
  const has=(list,k)=>list.includes(k)||list.join(" ").includes(k);
  if(has(pa,b)||has(pb,a))return 2;
  const common=pa.filter(x=>pb.includes(x)).length;
  return common>=3?1:common>=1?.5:0;
}
function roleOf(k){return KB[k]?KB[k][1]:null;}
function analyze(){
  const sel=selected();const keys=[],unknown=[];
  sel.forEach(p=>{const k=keyOf(p);if(k&&!keys.includes(k))keys.push(k);else if(!k)unknown.push(p);});
  const rows=keys.map(k=>{
    const good=keys.filter(o=>o!==k&&pairScore(k,o)>=1).sort((a,b)=>pairScore(k,b)-pairScore(k,a));
    const bad=keys.filter(o=>o!==k&&pairScore(k,o)<0);
    const sugg=pairs(k).filter(o=>KB[o]&&!keys.includes(o)).slice(0,4);
    return {k,good,bad,sugg};
  });
  return {keys,unknown,rows};
}
function comboScore(list){let s=0,n=0;for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){s+=pairScore(list[i],list[j]);n++;}return n?s/n:0;}
function stars(v){const n=v>=1.4?5:v>=1?4:v>=.6?3:v>=.3?2:1;return "★★★★★".slice(0,n)+"☆☆☆☆☆".slice(0,5-n);}
const lst=a=>a.length<=1?(a[0]||""):a.slice(0,-1).join(", ")+" e "+a[a.length-1];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

// sceglie i compagni migliori per una base
function pickCompanions(base,pool,max){
  const cand=pool.filter(k=>k!==base&&!["aroma","herb","fresh","pantry"].includes(roleOf(k))&&pairScore(base,k)>=0);
  const chosen=[];
  while(chosen.length<max&&cand.length){
    let best=null,bs=-9;
    cand.forEach(k=>{if(chosen.includes(k))return;
      const s=pairScore(base,k)*1.5+chosen.reduce((t,c)=>t+pairScore(c,k),0)-(chosen.some(c=>roleOf(c)==="dairy")&&roleOf(k)==="dairy"?2:0)-(chosen.some(c=>roleOf(c)==="prot")&&roleOf(k)==="prot"?2:0);
      if(s>bs){bs=s;best=k;}});
    if(best===null||bs<0)break;chosen.push(best);cand.splice(cand.indexOf(best),1);
  }
  return chosen;
}
function pickAromas(core,pool){
  const ar=pool.filter(k=>["aroma","herb","fresh"].includes(roleOf(k)));
  const ok=ar.filter(a=>core.some(c=>pairScore(c,a)>=1)||a==="aglio"||a==="cipolla");
  // suggerimento esterno: erba che si abbina meglio e non è in dispensa
  let sug=null,ss=0;
  Object.keys(KB).filter(k=>["fresh","herb"].includes(roleOf(k))&&!pool.includes(k)).forEach(k=>{const s=core.reduce((t,c)=>t+Math.max(0,pairScore(c,k)),0);if(s>ss){ss=s;sug=k;}});
  return {have:ok,suggest:ss>=2?sug:null};
}
function whyOf(list){
  const out=[];
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){const s=pairScore(list[i],list[j]);if(s>=2)out.push(list[i]+" + "+list[j]);}
  return out.slice(0,5);
}

function qty(k){return Q[k]||Q[roleOf(k)]||"q.b.";}
function cut(k){const c=KB[k]?KB[k][2][0]:"";return c?k+" "+c:k;}
function mins(k){return KB[k]?KB[k][2][1]:5;}
function vegSeq(vs,start){
  if(!vs.length)return [];
  const s=[...vs].sort((a,b)=>mins(b)-mins(a));
  if(s.length===1)return [`${start} ${cut(s[0])} e cuoci circa ${Math.max(mins(s[0]),3)} minuti, aggiungendo un goccio d'acqua se asciuga.`];
  let txt=`${start} ${cut(s[0])}`;
  for(let i=1;i<s.length;i++){const d=mins(s[i-1])-mins(s[i]);txt+=d>1?`; dopo ${d} minuti unisci ${cut(s[i])}`:` e ${cut(s[i])}`;}
  txt+=`, e cuoci ancora ${Math.max(mins(s[s.length-1]),3)} minuti finché tutto è tenero.`;return [txt];
}

function genRecipes(){
  const {keys}=analyze();if(!keys.length)return [];
  const bases=keys.filter(k=>roleOf(k)==="base");
  const legs=keys.filter(k=>roleOf(k)==="legume");
  const fruits=keys.filter(k=>roleOf(k)==="fruit");
  const vegs=keys.filter(k=>roleOf(k)==="veg");
  const out=[];
  const mk=(base,comps,title,e,time,stepsFn,extra={})=>{
    const core=[base,...comps].filter(Boolean);
    const ar=pickAromas(core,keys);
    const cs=comboScore(core.concat(ar.have.filter(a=>!["aglio","cipolla"].includes(a))));
    const ing=core.map(k=>[k,qty(k)]).concat(ar.have.map(k=>[k,qty(k)]));
    if(extra.egg1)ing.forEach(i=>{if(i[0]==="uova")i[1]="1";});
    (extra.need||[]).forEach(n=>{if(!ing.some(i=>i[0]===n[0]))ing.push(n);});
    const st=stepsFn(ar);
    const why=whyOf(core.concat(ar.have));
    const r={id:"gen-"+core.join("-").replace(/\s/g,"_"),e,t:title,s:`Creata dai tuoi ingredienti · per 2 persone`,time,ing,st,gen:true,stars:stars(cs),
      why:why.length?"Abbinamenti classici: "+why.join(", ")+".":"Combinazione insolita ma compatibile: assaggia e regola.",
      tip:ar.suggest?`Se ce l'hai, aggiungi ${ar.suggest}: è l'erba che si sposa meglio con questa combinazione.`:"Usa gli avanzi entro 2 giorni o trasformali in una frittata.",cs};
    out.push(r);
  };
  const soff=(ar)=>{const s=ar.have.filter(a=>["aglio","cipolla"].includes(a));const h=ar.have.filter(a=>roleOf(a)==="herb");
    return s.length||h.length?`In una padella ampia scalda 2 cucchiai d'olio con ${lst(s.map(cut).concat(h))} a fuoco dolce per 2–3 minuti.`:"Scalda 2 cucchiai d'olio in una padella ampia.";};
  const fresh=ar=>ar.have.filter(a=>roleOf(a)==="fresh");

  bases.forEach(b=>{
    const pool=keys.concat(b==="pasta"||b==="riso"?[]:[]);
    let comps=pickCompanions(b,keys.filter(k=>roleOf(k)!=="base"||k===b),3);

async function aiSend(q){
  q=String(q||"").trim();if(!q||SH.busy)return;
  SH.msgs.push({role:"user",content:q});const cur={role:"assistant",content:"",pending:true};SH.msgs.push(cur);SH.busy=true;drawSheet();
  const c=SH.ctx,prof=profileText();
  const system=SYS_RIMEDIA+"\n\nCONTESTO APERTO NELL'APP ("+(c.sub||"")+")\n"+c.text+(prof?"\n\nPROFILO DELL'UTENTE\n"+prof:"");
  let history=SH.msgs.filter(m=>m!==cur&&!m.err&&m.content).map(m=>({role:m.role,content:m.content})).slice(-10);
  while(history.length&&history[0].role!=="user")history.shift();
  let started=false;
  try{
    const r=await RAI.run({system,history,stream:true,maxTokens:2048,
      onText:t=>{started=true;cur.pending=false;cur.content+=t;if(SH.open&&SH.ctx===c)paintLast();},started:()=>started,
      onStatus:s=>{if(!started){cur.status=s;if(SH.open&&SH.ctx===c)paintLast();}}});
    cur.content=r.text;cur.prov=RAI.providerLabel(r.provider);
    addHist({type:"ai",t:q,ctx:c.title});
  }catch(e){cur.err=true;cur.code=e.code;cur.content="⚠️ "+(e.message||"Errore imprevisto: riprova")+(started&&cur.content?"":"");}
  cur.pending=false;SH.busy=false;if(SH.open&&SH.ctx===c)drawSheet();
}

async function aiShop(){
  const plan=$("#mealplan").value.trim();if(!plan){toast("Incolla il tuo piano alimentare");return;}
  const out=$("#aishopout");out.innerHTML='<div class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span> Calcolo la spesa…</div>';
  const cats=SHOPCATS.map(c=>c[0]).concat("Altro").join(", ");
  try{
    const txt=await aiCall("Sei un assistente per la spesa. Scrivi in italiano.",`Trasforma questo piano alimentare in una lista della spesa consolidata, sommando le quantità dello stesso alimento sull'intero periodo e arrotondando a confezioni realistiche. Escludi sale, pepe, olio e acqua. Escludi anche ciò che ho già in dispensa: ${S.pantry.join(", ")||"niente"}. Categorie ammesse: ${cats}.
Piano:
${plan}
Rispondi SOLO con JSON valido: {"items":[{"name":"alimento","qty":"quantità totale","cat":"categoria"}]}`,{json:true});
    const data=parseJSON(txt);let n=0;
    (data.items||[]).forEach(x=>{if(x&&x.name&&addShop(x.name,x.qty,x.cat))n++;});save();render();toast(n+" voci aggiunte alla lista");
  }catch(e){out.innerHTML=`<div class="note warn">${esc(e.message||"Non sono riuscito a leggere il piano. Riprova.")}</div>`;}
}

/* ================= TIMER ================= */
let tInt=null,actx=null;
function startTimer(label,sec){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume();}catch(e){}
  clearInterval(tInt);let end=Date.now()+sec*1000;$("#tLabel").textContent="🌿 "+label;$("#timer").classList.add("on");
  const tick=()=>{const s=Math.max(0,Math.round((end-Date.now())/1000));$("#tTime").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
    if(s<=0){clearInterval(tInt);$("#tTime").textContent="Pronta!";beep();try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}};
  tick();tInt=setInterval(tick,500);
}
function beep(){try{if(!actx)return;[0,.35,.7].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.3,actx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.3);o.connect(g).connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.32);});}catch(e){}}
$("#tStop").onclick=()=>{clearInterval(tInt);$("#timer").classList.remove("on");};

/* ================= AVVIO ================= */
loadLocal();
$("#hsForm").onsubmit=e=>{e.preventDefault();const v=$("#hsIn").value.trim();if(v)doSearch(v);};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&SH.open)closeAI();});
sampleFn=undefined; // sconosciuto finché non risponde
render();
(async()=>{
  const C=window.claude;if(!C||!C.use){sampleFn=null;render();return;}
  C.use("sample").then(s=>{sampleFn=s||null;window.__rimediaSample=s||null;render();}).catch(()=>{sampleFn=null;render();});
  try{
    const [dbx,user]=await Promise.all([C.use("db"),C.use("user")]);
    if(dbx&&user){const uid=await user.id();if(uid){db=dbx;dref=db.doc("data/users/"+uid+"/stato");
      let done=false;const to=setTimeout(()=>{done=true;},10000);
      const snap=await dref.get();clearTimeout(to);if(done)return;
      const d=snap&&(typeof snap.data==="function"?snap.data():(snap.data!==undefined?snap.data:snap));
      if(d&&typeof d==="object"&&(d.pantry||d.shopping||d.favs||d.plan)){S=Object.assign({pantry:[],unsel:[],shopping:[],plan:[],favs:[]},d);fixS();try{localStorage.setItem("rimedia",JSON.stringify(S));}catch(e){}render();}
      else if(S.pantry.length||S.shopping.length||S.favs.length||S.plan.length){dref.set(JSON.parse(JSON.stringify(S))).catch(()=>{});}
    }}
  }catch(e){}
})();
